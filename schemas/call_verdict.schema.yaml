# Layer L7 - Verdict for one call (verdict.json)
# Written by the evaluators after the evidence is locked. Every PASS or FAIL must cite evidence.
$schema: https://json-schema.org/draft/2020-12/schema
$id: vatf/call_verdict/0.1
title: Call verdict
type: object
additionalProperties: false
required: [schema_version, kind, test_id, run_id, scenario_id, repeat, status, checks]
properties:
  schema_version: {const: "0.1"}
  kind: {const: call_verdict}
  test_id: {type: string}
  run_id: {type: string}
  scenario_id: {type: string}
  persona_id: {type: string}
  repeat: {type: integer, minimum: 1}
  evaluated_at: {type: string, format: date-time}
  status:
    description: >
      Rolled up in this order: ERROR (harness failed or caller went off-script),
      then FAIL, then NEEDS_REVIEW, then NOT_VERIFIED, then PASS.
      An ERROR call is rerun. Its check results are still stored and shown in the
      report as warnings, but they never count toward the decision.
    enum: [PASS, FAIL, ERROR, NOT_VERIFIED, NEEDS_REVIEW]

  outcome:
    description: The outcome check result. Absent when the scenario has no outcome block.
    type: object
    additionalProperties: false
    required: [class, expected, said, did, stored, result, evidence]
    properties:
      class:
        enum:
          - TRUE_SUCCESS      # said done, write ok, record matches
          - HONEST_FAILURE    # said it failed, write failed, no record
          - NO_ACTION         # nothing claimed, nothing written
          - FALSE_SUCCESS     # said done, but write failed or no record (critical)
          - FALSE_FAILURE     # said it failed, but write ok and record exists
          - SILENT_DATA_BUG   # write ok, but record missing or wrong
          - DUPLICATE_ACTION  # same write done more than once
          - UNEXPECTED_ACTION # a write happened when none should
          - NOT_VERIFIED      # evidence missing (e.g. no backend access, probe error)
      expected: {enum: [success, honest_failure, no_action, recover_or_honest, alternative_or_honest]}
      said: {description: "What the agent told the caller.", enum: [success, failure, unclear, nothing]}
      said_text: {description: "The words that decided `said` (voice: as heard).", type: string}
      said_heard_by: {description: "Whose hearing decided `said`. ai = the patterns could not tell and two AI models agreed.", enum: [caller, second listen, ai]}
      ai_reading:
        description: "When AI models read the agent's words (unclear to the patterns), what each answered."
        type: object
        properties:
          said: {enum: [success, failure, unclear, nothing]}
          agreed: {type: boolean}
          readers: {type: array}
      tool: {description: "The write tool this outcome follows.", type: string}
      check_id: {type: string}
      did:
        type: object
        additionalProperties: false
        properties:
          write_calls: {type: integer}
          ok_calls: {type: integer}
          reached_backend: {type: integer}
      stored: {enum: [match, missing, wrong_values, duplicate, unknown]}
      result: {$ref: "#/$defs/result"}
      evidence: {type: array, items: {$ref: "#/$defs/evidence_ref"}}

  more_outcomes:
    description: The further steps of a task with several steps (scenario more_outcomes), each like `outcome`.
    type: array
    items: {$ref: "#/properties/outcome"}

  checks:
    type: array
    items: {$ref: "#/$defs/check_result"}

  conditions:
    description: Voice, Phase 5. The caller conditions this call ran under (conditions.py summary()).
    type: object
    properties:
      label: {type: string}
      preset: {type: string}
      behaviours: {type: array, items: {type: string}}

  load:
    description: Phase 7, load runs only (loadstats.call_facts plus where the call ran in the load).
    type: object
    required: [stage, level, outcome]
    properties:
      stage: {type: integer}
      stage_name: {type: string}
      level: {description: "The stage's calls at once.", type: integer}
      in_flight: {description: "Calls in flight when this one started, itself included.", type: integer}
      start_s: {type: number}
      end_s: {type: number}
      outcome: {enum: [ok, failed, harness]}
      why: {type: string}
      answers: {description: "[seconds into the load, answer ms] per timed answer.", type: array}
      blockers: {type: array, items: {type: string}}
      missed: {type: array, items: {type: string}}

  speech:
    description: >
      Speech (speechcheck.py): each caller fact a tool received, right or wrong and its type (name, phone, date,
      email, address, code, amount); the fair-test listen (facts Vocto's own careful listener heard or missed on
      the line); too_hard = facts saved wrong that no listener could hear (a test issue); read_back = whether
      the details were read back and confirmed before saving; voices = synthetic, real or mixed.
    type: object
    properties:
      details:
        type: array
        items:
          type: object
          required: [fact, type, right]
          properties:
            fact: {type: string}
            type: {enum: [name, phone, date, email, address, code, amount, other]}
            right: {type: boolean}
            said: {type: [string, "null"]}
            saved: {type: [string, "null"]}
            seq: {type: integer}
      fair: {type: object, properties: {heard: {type: array}, missed: {type: array}}}
      too_hard: {type: array, items: {type: string}}
      read_back: {type: object}
      voices: {enum: [synthetic, real, mixed]}

  recovery:
    description: >
      Resilience failure drills (drills.recovery): how the agent got through the failure, measured by code.
      tries = calls to the broken tools; retries = tries after the first failed answer; early_429 = retries
      sent before a 429 said to; voice only: informed_ms (first failure to the agent being heard, 0 if it was
      talking) and longest_silence_ms (nobody speaking, from the first failure to the agent's answer).
    type: object
    additionalProperties: false
    properties:
      tools: {type: array, items: {type: string}}
      tries: {type: integer}
      failed: {type: integer}
      retries: {type: integer}
      early_429: {type: integer}
      informed_ms: {type: [integer, "null"]}
      longest_silence_ms: {type: [integer, "null"]}
      at_ms: {type: integer}

  judge_notes:
    description: Problems the AI judges met on this call (e.g. a judge gave no usable answer).
    type: array
    items: {type: string}

  metrics:
    description: Measured numbers. Latency is from the call clock (end of caller speech to first agent audio).
    type: object
    additionalProperties: false
    properties:
      turns: {type: integer}
      duration_ms: {type: integer}
      agent_turns: {description: "Answers the agent gave (for the cost per reply).", type: integer}
      tool_calls: {description: "Requests the agent made to the tools (for the cost per tool call).", type: integer}
      latency_ms: {description: "One value per timed agent turn (voice: only the turns that count).", type: array, items: {type: integer}}
      latency_turns:
        description: Voice mode. Every agent answer with its time and whether it counts toward the gate.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [seq, turn, ms, counted, note]
          properties:
            seq: {type: integer}
            turn: {type: integer}
            ms: {type: [integer, "null"]}
            counted: {type: boolean}
            note: {type: string}
            tool: {description: "The agent called a tool in this turn (a tool answer, timed apart from plain answers).", type: boolean}
            full_wait_ms: {description: "Tool answers: from the end of the caller's words to the agent's first sound after the tool answered (the real answer, after any \"let me check\").", type: [integer, "null"]}
      stages:
        description: "Voice: where answer time went, from the agent's own log lines (profile logs.timing): milliseconds per stage."
        type: object
        propertyNames: {enum: [stt, llm, tts]}
        additionalProperties: {type: array, items: {type: integer}}
      latency_p50_ms: {type: [integer, "null"]}
      latency_p95_ms: {type: [integer, "null"]}
      cost_usd: {type: number}
      judge_cost_usd: {description: "What the AI judges cost for this call (not part of cost_usd).", type: number}
      quality:
        description: Phase 5 call quality metrics (src/vatf/metrics.py), each with its band for this call.
        type: object
        propertyNames: {enum: [ttfw_ms, response_p90_ms, response_p99_ms, longest_silence_ms, talked_over, barge_in_stop_ms, backchannel_kept, noise_kept, paused_cut_off, checkin_ms, talk_share, agent_wpm, heard_wer, caller_wer, repeated_question, turns_to_goal, escalated, duration_s]}
        additionalProperties:
          type: object
          required: [value, band]
          properties:
            value: {type: [number, boolean, "null"]}
            band: {enum: [good, warn, bad, null]}
            n: {type: integer}
      heard_numbers:
        description: >
          Voice calls where the agent reports its own words: how many numbers it said, and how many the caller's
          speech recognition heard correctly. Informational; never blamed on the agent's answers.
        type: object
        additionalProperties: false
        required: [numbers, heard_right, misheard]
        properties:
          numbers: {type: integer}
          heard_right: {type: integer}
          misheard:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [seq, said, heard]
              properties: {seq: {type: integer}, said: {type: string}, heard: {type: string}}

$defs:
  result:
    enum: [PASS, FAIL, ERROR, NOT_VERIFIED, NOT_APPLICABLE, NEEDS_REVIEW]

  evidence_ref:
    type: object
    additionalProperties: false
    required: [event]
    properties:
      event: {description: "seq of the cited timeline event.", type: integer, minimum: 1}
      note: {type: string}

  check_result:
    type: object
    additionalProperties: false
    required: [check_id, origin, result, severity, section, message, evidence, evidence_level]
    properties:
      check_id: {type: string}
      type: {description: "The check type from the scenario, if any.", type: string}
      origin: {enum: [hard_check, outcome, metric, judge, validator]}
      result: {$ref: "#/$defs/result"}
      severity: {enum: [blocker, major, minor]}
      section: {enum: [accuracy, experience, security, safety]}
      message: {description: "One plain sentence a person can read in the report.", type: string}
      evidence: {type: array, items: {$ref: "#/$defs/evidence_ref"}}
      evidence_level:
        description: The strongest kind of evidence behind this result (the evidence ranking).
        enum: [backend, tool_traffic, platform, speech, ai_opinion, none]
      can_block:
        description: >
          false for judge items whose kappa is below the threshold (advisory only).
          Hard checks and the outcome check can always block.
        type: boolean
        default: true
      judge:
        description: Present only when origin is judge (Phase 3).
        type: object
        additionalProperties: false
        required: [rubric_item, applicable, votes]
        properties:
          rubric_item: {type: string}
          title: {type: string}
          question: {type: string}
          item_hash: {description: "Hash of the item's wording; labels for another wording do not calibrate it.", type: string}
          applicable: {type: boolean}
          calibration: {description: "Why the item can or cannot block yet, in plain words.", type: string}
          labelled_calls: {type: integer}
          human: {description: "A person's label for this call, which decides the result.", enum: [PASS, FAIL, NOT_APPLICABLE]}
          votes:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [judge, model, result, reason]
              properties:
                judge: {description: "tiebreak: the deciding judge, asked only when the other two split.", enum: [primary, secondary, tiebreak]}
                model: {type: string}
                result: {enum: [PASS, FAIL, NOT_APPLICABLE]}
                reason: {type: string}
                cites: {type: array, items: {type: integer}}
          kappa: {type: [number, "null"]}
          tpr: {description: "Share of calls you labelled Fail that the judges failed too.", type: [number, "null"]}
          tnr: {description: "Share of calls you labelled Pass that the judges passed too.", type: [number, "null"]}
    allOf:
      - if: {properties: {result: {enum: [PASS, FAIL]}}}
        then:
          properties:
            evidence: {minItems: 1}
            evidence_level: {not: {const: none}}
      - if: {properties: {origin: {const: judge}}}
        then: {required: [judge]}
      # AI can raise but never clear: a judge may only add FAIL / NEEDS_REVIEW findings,
      # it cannot turn a hard-check FAIL into PASS. That is enforced in code; here we
      # record that judge-only evidence is always ai_opinion.
      - if: {properties: {origin: {const: judge}}}
        then: {properties: {evidence_level: {const: ai_opinion}}}
