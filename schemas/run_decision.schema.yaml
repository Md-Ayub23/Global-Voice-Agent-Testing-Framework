# Layer L8 - Release decision for one run (decision.json)
# Built only from call verdicts and the profile thresholds.
#
# Decision rules, checked in this order:
#   1. NO_GO  - any blocking FAIL in a verified call (false success, silent data bug,
#               duplicate action, data leak, security failure, or any check marked blocker).
#   2. NO_GO  - a critical scenario has a FAIL in any repeat (pass^k not met),
#               or latency p95 is above the limit (voice mode only; text-mode
#               timings are shown for information and never gate).
#   3. NO_GO_INSUFFICIENT_EVIDENCE - coverage below min_coverage, a critical scenario
#               has fewer verified repeats than pass_k_required, or NEEDS_REVIEW items remain.
#               This means: fix the harness or add tests, not the agent.
#   4. GO     - none of the above.
$schema: https://json-schema.org/draft/2020-12/schema
$id: vatf/run_decision/0.1
title: Run decision
type: object
additionalProperties: false
required: [schema_version, kind, run_id, profile_id, decision, exit_code, reasons, scorecard, reliability, coverage]
properties:
  schema_version: {const: "0.1"}
  kind: {const: run_decision}
  run_id: {type: string}
  profile_id: {type: string}
  created_at: {type: string, format: date-time}
  relabelled_at: {description: "When a person's judge labels last changed this decision.", type: string, format: date-time}
  decision: {enum: [GO, NO_GO, NO_GO_INSUFFICIENT_EVIDENCE]}
  exit_code:
    description: For CI. 0 = GO, 1 = NO_GO, 2 = NO_GO_INSUFFICIENT_EVIDENCE. A crash of the framework itself writes no decision and exits 3.
    enum: [0, 1, 2]
  reasons:
    description: Why the decision came out this way, most important first.
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [rule, message]
      properties:
        rule: {enum: [blocker, reliability, latency, coverage, needs_review, all_targets_met, safety_warnings, metric, metric_warnings, regression, regression_warnings, load_failed_calls, load_latency, load_metric, load_blocker, load_slowdown, load_pass_drop, load_drift, load_evidence, load_ok, load_warnings]}
        message: {type: string}
        refs:
          description: test_id or test_id/check_id pointing at the verdicts behind this reason.
          type: array
          items: {type: string}

  scorecard:
    description: Accuracy and Experience are kept apart on purpose; one blended score hides tradeoffs.
    type: object
    additionalProperties: false
    required: [accuracy, experience]
    properties:
      accuracy: {$ref: "#/$defs/section_score"}
      experience: {$ref: "#/$defs/section_score"}
      security: {$ref: "#/$defs/section_score"}
      safety: {$ref: "#/$defs/section_score"}

  reliability:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [scenario_id, criticality, k, passed, failed, unverified]
      properties:
        scenario_id: {type: string}
        criticality: {enum: [critical, normal, exploratory]}
        k: {type: integer}
        passed: {type: integer}
        failed: {type: integer}
        unverified: {description: "Repeats that ended ERROR, NOT_VERIFIED or NEEDS_REVIEW.", type: integer}
        pass_at_k: {description: "At least one repeat passed.", type: [boolean, "null"]}
        pass_hat_k: {description: "All k repeats passed. null when there is not enough evidence to say.", type: [boolean, "null"]}

  latency:
    description: Measured from recorded audio in voice mode. null in text-only runs.
    type: object
    additionalProperties: false
    properties:
      turns_measured: {type: integer}
      p50_ms: {type: [integer, "null"]}
      p95_ms: {type: [integer, "null"]}
      p50_limit_ms: {type: integer}
      p95_limit_ms: {type: integer}
      within_limits: {type: [boolean, "null"]}

  coverage:
    type: object
    additionalProperties: false
    required: [planned_calls, verified_calls, ratio, min_required]
    properties:
      planned_calls: {type: integer}
      verified_calls: {description: "Calls whose status is PASS or FAIL.", type: integer}
      error_calls: {type: integer}
      not_verified_calls: {type: integer}
      needs_review_calls: {type: integer}
      ratio: {type: number, minimum: 0, maximum: 1}
      min_required: {type: number}

  judges:
    description: Calibration status of each judge rubric item used in this run (Phase 3).
    type: array
    items:
      type: object
      additionalProperties: false
      required: [rubric_item, kappa, can_block]
      properties:
        rubric_item: {type: string}
        title: {type: string}
        kappa: {type: [number, "null"]}
        tpr: {type: [number, "null"]}
        tnr: {type: [number, "null"]}
        labelled_calls: {type: integer}
        can_block: {type: boolean}
        calibration: {type: string}
        passed: {type: integer}
        failed: {type: integer}
        needs_review: {type: integer}
        not_applicable: {type: integer}

  basis:
    description: What decided the run, in layers, and the AI judge opinions that were left out of it.
    type: object
    additionalProperties: false
    required: [decided_by, judge_opinions]
    properties:
      decided_by:
        type: array
        items: {enum: [all_checks, hard_checks, trusted_judges, reliability, latency, call_quality, evidence, regression, load]}
      judge_opinions: {description: "Judge findings from items not trusted yet: shown, never counted.", type: integer}
      opinions_to_label: {description: "Of those, where the judges split and a person's label is wanted.", type: integer}
      trusted_items: {type: integer}

  heard_numbers:
    description: Voice runs where the agent reports its own words. Numbers it said and how many the caller heard right.
    type: object
    additionalProperties: false
    required: [numbers, heard_right, misheard]
    properties:
      numbers: {type: integer}
      heard_right: {type: integer}
      misheard:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [test_id, seq, said, heard]
          properties: {test_id: {type: string}, seq: {type: integer}, said: {type: string}, heard: {type: string}}

  quality:
    description: Phase 5. Call quality metrics over the run (src/vatf/metrics.py run_quality), with bands.
    type: array
    items:
      type: object
      required: [id, title, unit, better, value, band, blocks, calls]
      properties:
        id: {enum: [ttfw_ms, response_p90_ms, response_p99_ms, longest_silence_ms, talked_over, barge_in_stop_ms, backchannel_kept, checkin_ms, talk_share, agent_wpm, heard_wer, turns_to_goal, escalated, duration_s]}
        title: {type: string}
        unit: {enum: [ms, "%", wpm, turns, s]}
        better: {enum: [lower, higher]}
        value: {type: [number, "null"]}
        band: {enum: [good, warn, bad, null]}
        good: {type: [number, "null"]}
        warn: {type: [number, "null"]}
        blocks: {type: boolean}
        calls: {type: integer}
        about: {type: string}
        detail: {type: object}

  by_condition:
    description: Phase 5, voice. Results split by the caller conditions the calls ran under.
    type: array
    items:
      type: object
      required: [label, calls, passed, failed]
      properties:
        label: {type: string}
        calls: {type: integer}
        passed: {type: integer}
        failed: {type: integer}
        pass_rate: {type: [number, "null"]}
        p50_ms: {type: [integer, "null"]}
        p90_ms: {type: [integer, "null"]}
        talked_over_pct: {type: [number, "null"]}
        behaviours: {type: array, items: {type: string}}

  load:
    description: Phase 7, load runs only (decision.apply_load). The full numbers are in the run's load.json.
    type: object
    additionalProperties: false
    required: [shape, calls_at_once, capacity, stages]
    properties:
      shape: {enum: [ramp, spike, soak, steady]}
      calls_at_once: {type: integer, minimum: 1}
      capacity: {description: "The highest level of calls at once up to which every stage met the limits.", type: integer, minimum: 0}
      breaking: {type: [object, "null"]}
      calls: {type: integer}
      failed: {type: integer}
      harness_errors: {type: integer}
      p95_limit_ms: {type: [number, "null"]}
      unattributed_tool_calls: {type: integer}
      stages:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            index: {type: integer}
            name: {type: string}
            kind: {enum: [step, normal, spike, recovery, hold, window]}
            level: {type: integer}
            calls: {type: integer}
            finished: {type: integer}
            failed: {type: integer}
            failed_pct: {type: [number, "null"]}
            pass_rate: {type: [number, "null"]}
            trusted: {type: boolean}
            meets_limits: {type: [boolean, "null"]}
            p50_ms: {type: [integer, "null"]}
            p95_ms: {type: [integer, "null"]}

  safety:
    description: The built-in safety tests in this run (attacks.py) and every finding, worst first.
    type: object
    additionalProperties: false
    properties:
      calls: {type: integer}
      passed: {type: integer}
      failed: {description: "Attack calls with at least one failed check (hard check or judge).", type: integer}
      to_review: {description: "Attack calls with no failure but a judge disagreement for a person to label.", type: integer}
      packs:
        type: object
        additionalProperties:
          type: object
          additionalProperties: false
          properties: {calls: {type: integer}, failed: {type: integer}, to_review: {type: integer}}
      findings:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            test_id: {type: string}
            scenario_id: {type: string}
            pack: {type: string}
            title: {type: string}
            check_id: {type: string}
            severity: {type: string}
            result: {type: string}
            can_block: {type: boolean}
            message: {type: string}

  baseline:
    description: >
      Phase 6. This run compared with the agent's baseline (compare.py); the full list of changes is in
      comparison.json. Absent when the agent has no baseline or the run was started with --baseline none.
    type: object
    additionalProperties: false
    required: [run_id, like_for_like, regressions, worse, better, blocking]
    properties:
      run_id: {type: [string, "null"]}
      decision: {type: [string, "null"]}
      finished_at: {type: [string, "null"]}
      like_for_like: {description: "Same mode, caller conditions, speech engine and offline setting.", type: boolean}
      regressions: {description: "Tests that passed every repeat in the baseline and failed now.", type: integer}
      worse: {type: integer}
      better: {type: integer}
      new: {type: integer}
      removed: {type: integer}
      blocking: {description: "Changes set to block (profile regression.<kind>.blocks) that made this a NO_GO.", type: integer}

  calls:
    description: Pointers to every call verdict in the run.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [test_id, scenario_id, repeat, status]
      properties:
        test_id: {type: string}
        scenario_id: {type: string}
        repeat: {type: integer}
        status: {enum: [PASS, FAIL, ERROR, NOT_VERIFIED, NEEDS_REVIEW]}

$defs:
  section_score:
    type: object
    additionalProperties: false
    required: [score, passed, failed, total, coverage]
    properties:
      score: {description: "passed / (passed + failed). null if nothing was verified.", type: [number, "null"], minimum: 0, maximum: 1}
      passed: {type: integer}
      failed: {type: integer}
      total: {description: "All check results in this section, including unverified ones.", type: integer}
      coverage: {description: "(passed + failed) / total. Always shown next to the score.", type: number, minimum: 0, maximum: 1}
