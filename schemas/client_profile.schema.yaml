# Layer L1 - Client Profile
# One YAML file describes one agent under test. Onboarding a new agent means
# writing one of these, not writing framework code.
$schema: https://json-schema.org/draft/2020-12/schema
$id: vatf/client_profile/0.1
title: Client Profile
type: object
additionalProperties: false
required: [schema_version, kind, id, name, domain, languages, connection, tools, backend]
properties:
  schema_version: {const: "0.1"}
  kind: {const: client_profile}
  extends:
    description: >
      Another profile file in the same folder to start from (e.g. profile-voice.yaml extends
      profile.yaml and only changes the connection). Mappings are merged key by key; lists
      and values here replace the base's. Removed by the loader before the schema check.
    type: string
  id:
    description: Short stable id, used by scenarios to point at this profile.
    type: string
    pattern: "^[a-z0-9][a-z0-9._-]*$"
  name: {type: string}
  description: {type: string}
  domain:
    description: Free text such as healthcare, trading, support. Used to pick rubrics and scenario packs.
    type: string
  languages:
    description: BCP-47 language tags. Only "en" is supported for now.
    type: array
    minItems: 1
    items: {type: string, pattern: "^[a-z]{2}(-[A-Z]{2})?$"}

  connection:
    description: How the framework reaches the agent (L4 Connectors).
    type: object
    required: [type]
    properties:
      type:
        enum: [text_python, text_http, websocket_audio, sip, webrtc, platform]
      target:
        description: >
          What to connect to. text_python: "module:callable" that builds the agent (agents in this repo).
          text_http: the agent's http(s) URL (docs/text-http-protocol.md). websocket_audio: its ws(s)
          URL (docs/voice-protocol.md). sip: a phone number or SIP URI. platform: an agent id on the platform.
        type: string
      launch:
        description: >
          websocket_audio only: "module:function" that starts a Python agent for each call.
          It is called as launch(tools=<tool proxy>, options=<options>) and returns an object
          with .url and async close(). Without it, vatf dials target.
        type: string
      platform: {enum: [vapi, retell, livekit, pipecat, elevenlabs]}
      audio:
        type: object
        properties:
          sample_rate_hz: {type: integer, enum: [8000, 16000, 24000, 48000]}
          encoding: {enum: [pcm16, mulaw]}
      options:
        description: >
          Connector-specific settings. Secrets are given as ${ENV_VAR} names, never as values.
          text_http and websocket_audio: headers (sent with every request / when connecting).
          text_http: reply_field, end_field, timeout_s.
        type: object
      offline_options:
        description: Merged into options for --offline runs (agents in this repo only), so nothing calls an API.
        type: object
    allOf:
      - if: {properties: {type: {const: platform}}}
        then: {required: [platform]}

  test_id:
    description: >
      How the unique test id reaches the agent and backend, so voice, tool calls and
      database rows can be linked. "proxy_header" means the tool proxy adds it to each
      upstream request; "session_metadata" means the connector passes it when the call starts.
    type: object
    properties:
      propagation:
        type: array
        items: {enum: [proxy_header, session_metadata, tool_arg]}
        default: [proxy_header]
      header_name: {type: string, default: X-Test-Id}

  tools:
    description: The tools or APIs the agent may call. Calls go through our tool proxy (L5).
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, effect]
      properties:
        name: {type: string}
        description: {type: string}
        effect:
          description: read tools only look things up; write tools change backend state and are what the outcome check follows.
          enum: [read, write]
        upstream:
          description: >
            Where the proxy forwards the call: the client's real (test) API URL, or python:module:function
            for agents in this repo. Agents that run elsewhere send their tool calls to the tool gateway
            (http://127.0.0.1:<tool_gateway.port>/tools/<name>), which forwards them here.
          type: string
        method:
          description: HTTP method for an http(s) upstream. GET sends the arguments as the query string.
          enum: [POST, GET, PUT, PATCH, DELETE]
          default: POST
        headers:
          description: 'Extra headers for the upstream, e.g. {Authorization: "Bearer ${ACME_API_TOKEN}"}.'
          type: object
          additionalProperties: {type: string}
        idempotency_key:
          description: Argument names that identify "the same action". Two successful write calls with the same values are a DUPLICATE_ACTION.
          type: array
          items: {type: string}
        pii_args:
          description: Argument names to mask in stored evidence.
          type: array
          items: {type: string}

  tool_gateway:
    description: >
      Where vatf listens for the tool calls of an agent that runs outside vatf (text_http, or
      websocket_audio without launch). Point the agent's tool calls at
      http://<host>:<port>/tools/<tool name> for test runs.
    type: object
    additionalProperties: false
    properties:
      host: {type: string, default: 127.0.0.1}
      port: {type: integer, minimum: 1, maximum: 65535, default: 8790}

  backend:
    description: How to read the real backend state after a call (backend probes, L5).
    type: object
    required: [access]
    properties:
      access:
        description: none means outcome checks that need the backend are reported as NOT_VERIFIED, never PASS.
        enum: [sql, rest, none]
      connection:
        description: >
          sql: sqlite:///path/to/file.db or postgresql://user:${PG_PASSWORD}@host:5432/db (read-only use).
          rest: the API's base URL. Secrets as ${NAME}.
        type: string
      headers:
        description: 'rest only. Headers for every probe, e.g. {Authorization: "Bearer ${ACME_API_TOKEN}"}.'
        type: object
        additionalProperties: {type: string}
      probes:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, query]
          properties:
            id: {type: string}
            description: {type: string}
            query:
              description: >
                SQL text, or "GET /path" for rest. Bind values available:
                :test_id, :call_started_at and :call_ended_at (ISO times of the call),
                and any :name from the scenario's caller facts. Agents that store the
                test id should be probed by :test_id; agents that cannot should be
                probed by caller facts inside the call's time window.
              type: string
            returns: {enum: [rows, one, count], default: rows}
            rows_field: {description: "rest: where the list of records is in the answer (dots for nesting, e.g. data.items).", type: string}
            empty_on_404: {description: "rest: a 404 answer means 'no record' (otherwise it is a probe error).", type: boolean, default: false}

  logs:
    description: >
      Where the agent's own logs are, so each call's log lines are kept with its evidence (platform
      evidence: what the agent reported, below tool traffic and backend state). See src/vatf/logs.py.
    type: object
    additionalProperties: false
    properties:
      source: {enum: [none, file, http], default: none}
      path: {description: "file: the log file (relative to the repo folder, or absolute).", type: string}
      match:
        description: "file: during_call keeps the lines written while the call ran; test_id keeps only lines containing the test id."
        enum: [during_call, test_id]
        default: during_call
      url: {description: "http: log search URL with {test_id}, {started_at}, {ended_at} placeholders.", type: string}
      headers: {type: object, additionalProperties: {type: string}}
      lines_field: {description: "http JSON answers: where the list of lines is (dots for nesting).", type: string}
      message_field: {description: "http JSON answers: the text of one line when lines are objects.", type: string, default: message}
      settle_ms: {description: "Wait this long after the call before reading, so the last lines are flushed.", type: integer, minimum: 0, default: 500}
      max_lines: {type: integer, minimum: 1, default: 300}
    allOf:
      - if: {properties: {source: {const: file}}, required: [source]}
        then: {required: [path]}
      - if: {properties: {source: {const: http}}, required: [source]}
        then: {required: [url]}

  thresholds:
    description: Release gate settings (L8). Every field has a framework default.
    type: object
    additionalProperties: false
    properties:
      repeats: {type: integer, minimum: 1, default: 3}
      pass_k_required:
        description: How many of the repeats must pass for a critical scenario. Default equals repeats (pass^k).
        type: integer
        minimum: 1
      latency_p50_ms: {type: integer, default: 800}
      latency_p95_ms: {type: integer, default: 1500}
      min_coverage:
        description: Share of planned calls that must end with a verified result (PASS or FAIL).
        type: number
        minimum: 0
        maximum: 1
        default: 0.9
      judge_min_kappa:
        description: A judge rubric item below this Cohen's kappa is advisory and cannot block.
        type: number
        default: 0.6
      max_harness_retries: {type: integer, minimum: 0, default: 2}

  limits:
    description: Cost and safety caps for one run.
    type: object
    additionalProperties: false
    properties:
      max_turns: {type: integer, default: 30}
      max_call_seconds: {type: integer, default: 300}
      max_reply_tokens: {type: integer, default: 400}
      budget_usd: {type: number, default: 5}
      parallel_calls: {type: integer, default: 1}
      end_of_turn_ms:
        description: Voice. Silence after which the simulated caller takes the agent's turn as finished.
        type: integer
        default: 1000
      no_reply_ms:
        description: Voice. How long the caller waits for an answer before reacting (a persona's hangs_up_after_silence_ms wins).
        type: integer
        default: 15000

  pii:
    description: Patterns to mask in transcripts and stored evidence.
    type: object
    properties:
      mask_patterns:
        type: array
        items:
          type: object
          required: [name, regex]
          properties:
            name: {type: string}
            regex: {type: string}
