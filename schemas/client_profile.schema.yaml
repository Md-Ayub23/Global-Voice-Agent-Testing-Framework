# Layer L1 - Client Profile
# One YAML file describes one agent under test. Onboarding a new agent means
# writing one of these, not writing framework code.
$schema: https://json-schema.org/draft/2020-12/schema
$id: vatf/client_profile/0.1
title: Client Profile
type: object
additionalProperties: false
required: [schema_version, kind, id, name, domain, languages, connection, tools, backend]
properties:
  schema_version: {const: "0.1"}
  kind: {const: client_profile}
  extends:
    description: >
      Another profile file in the same folder to start from (e.g. profile-voice.yaml extends
      profile.yaml and only changes the connection). Mappings are merged key by key; lists
      and values here replace the base's. Removed by the loader before the schema check.
    type: string
  id:
    description: Short stable id, used by scenarios to point at this profile.
    type: string
    pattern: "^[a-z0-9][a-z0-9._-]*$"
  name: {type: string}
  description: {type: string}
  agent_prompt:
    description: >
      The agent's own instructions (its system prompt), pasted as written. Used by the test plan writer
      (vatf plan, Set up > Test plan > Write tests for me) to work out the agent's jobs and rules.
    type: string
  domain:
    description: Free text such as healthcare, trading, support. Used to pick rubrics and scenario packs.
    type: string
  languages:
    description: >
      BCP-47 language tags of the languages the agent speaks, first one first. Vocto's caller speaks
      English ("en") and Tamil ("ta"); a caller speaks the agent's first language unless its persona
      gives its own language.
    type: array
    minItems: 1
    items: {type: string, pattern: "^[a-z]{2}(-[A-Z]{2})?$"}

  connection:
    description: How the framework reaches the agent (L4 Connectors).
    type: object
    required: [type]
    properties:
      type:
        enum: [text_python, text_http, websocket_audio, twilio_media_stream, phone_call, sip, webrtc, platform]
      target:
        description: >
          What to connect to. text_python: "module:callable" that builds the agent (agents in this repo).
          text_http: the agent's http(s) URL (docs/text-http-protocol.md). websocket_audio: its ws(s)
          URL (docs/voice-protocol.md). twilio_media_stream: the ws(s) URL of the agent's Twilio Media Streams
          server, the one a TwiML <Stream url> would point at (docs/twilio-protocol.md).
          phone_call: the agent's real phone number in international format (+14155550123); Vocto rings it
          through the team's Twilio or Plivo account (docs/phone-guide.md). sip: a phone number or SIP URI. platform: an agent id on the platform.
        type: string
      launch:
        description: >
          websocket_audio and twilio_media_stream: "module:function" that starts a Python agent for each call.
          It is called as launch(tools=<tool proxy>, options=<options>) and returns an object
          with .url and async close(). Without it, vatf dials target.
        type: string
      platform: {enum: [vapi, retell, livekit, pipecat, elevenlabs]}
      audio:
        type: object
        properties:
          sample_rate_hz: {type: integer, enum: [8000, 16000, 24000, 48000]}
          encoding: {enum: [pcm16, mulaw]}
      options:
        description: >
          Connector-specific settings. Secrets are given as ${ENV_VAR} names, never as values.
          text_http, websocket_audio and twilio_media_stream: headers (sent with every request / when connecting).
          text_http: reply_field, end_field, timeout_s.
          twilio_media_stream: custom_parameters (what TwiML <Parameter> would pass in the start message),
          account_sid (sent in the start message; a made-up one when not given), jitter_buffer_ms (default 60:
          agent audio that arrives up to this late plays on without a gap, like a phone line's playout buffer).
          phone_call: provider (twilio or plivo), account_sid (Plivo: the Auth ID) and auth_token (as ${NAME}),
          from_number (the team's Twilio or Plivo number), ring_timeout_s (default 30), public_url (the team's own
          https address for Vocto's phone line, forwarding to line_port, default 8766; without it Vocto opens
          a Cloudflare quick tunnel), jitter_buffer_ms.
        type: object
      offline_options:
        description: Merged into options for --offline runs (agents in this repo only), so nothing calls an API.
        type: object
    allOf:
      - if: {properties: {type: {const: platform}}}
        then: {required: [platform]}

  test_id:
    description: >
      How the unique test id reaches the agent and backend, so voice, tool calls and
      database rows can be linked. "proxy_header" means the tool proxy adds it to each
      upstream request; "session_metadata" means the connector passes it when the call starts.
    type: object
    properties:
      propagation:
        type: array
        items: {enum: [proxy_header, session_metadata, tool_arg]}
        default: [proxy_header]
      header_name: {type: string, default: X-Test-Id}

  tools:
    description: The tools or APIs the agent may call. Calls go through our tool proxy (L5).
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, effect]
      properties:
        name: {type: string}
        description: {type: string}
        effect:
          description: read tools only look things up; write tools change backend state and are what the outcome check follows.
          enum: [read, write]
        upstream:
          description: >
            Where the proxy forwards the call: the client's real (test) API URL, or python:module:function
            for agents in this repo. Agents that run elsewhere send their tool calls to the tool gateway
            (http://127.0.0.1:<tool_gateway.port>/tools/<name>), which forwards them here.
          type: string
        method:
          description: HTTP method for an http(s) upstream. GET sends the arguments as the query string.
          enum: [POST, GET, PUT, PATCH, DELETE]
          default: POST
        headers:
          description: 'Extra headers for the upstream, e.g. {Authorization: "Bearer ${ACME_API_TOKEN}"}.'
          type: object
          additionalProperties: {type: string}
        idempotency_key:
          description: Argument names that identify "the same action". Two successful write calls with the same values are a DUPLICATE_ACTION.
          type: array
          items: {type: string}
        pii_args:
          description: Argument names to mask in stored evidence.
          type: array
          items: {type: string}

  tool_gateway:
    description: >
      Where vatf listens for the tool calls of an agent that runs outside vatf (text_http,
      twilio_media_stream, or websocket_audio without launch). Point the agent's tool calls at
      http://<host>:<port>/tools/<tool name> for test runs.
    type: object
    additionalProperties: false
    properties:
      host: {type: string, default: 127.0.0.1}
      port: {type: integer, minimum: 1, maximum: 65535, default: 8790}

  backend:
    description: How to read the real backend state after a call (backend probes, L5).
    type: object
    required: [access]
    properties:
      access:
        description: none means outcome checks that need the backend are reported as NOT_VERIFIED, never PASS.
        enum: [sql, rest, none]
      connection:
        description: >
          sql: sqlite:///path/to/file.db or postgresql://user:${PG_PASSWORD}@host:5432/db (read-only use).
          rest: the API's base URL. Secrets as ${NAME}.
        type: string
      headers:
        description: 'rest only. Headers for every probe, e.g. {Authorization: "Bearer ${ACME_API_TOKEN}"}.'
        type: object
        additionalProperties: {type: string}
      watch:
        description: >
          The tables copied right before and after each call, to catch changes the test didn't ask for
          (the "nothing else changed" check). Left out: the tables the probes read. false turns it off.
          rest: "GET /path" reads that return a whole collection.
        oneOf:
          - {type: boolean, const: false}
          - {type: array, items: {type: string}}
      watch_ignore:
        description: Tables, or table.column, that may always change (audit logs, sessions, updated_at).
        type: array
        items: {type: string}
      probes:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, query]
          properties:
            id: {type: string}
            description: {type: string}
            query:
              description: >
                SQL text, or "GET /path" for rest. Bind values available:
                :test_id, :call_started_at and :call_ended_at (ISO times of the call),
                and any :name from the scenario's caller facts. Agents that store the
                test id should be probed by :test_id; agents that cannot should be
                probed by caller facts inside the call's time window.
              type: string
            returns: {enum: [rows, one, count], default: rows}
            rows_field: {description: "rest: where the list of records is in the answer (dots for nesting, e.g. data.items).", type: string}
            empty_on_404: {description: "rest: a 404 answer means 'no record' (otherwise it is a probe error).", type: boolean, default: false}

  logs:
    description: >
      Where the agent's own logs are, so each call's log lines are kept with its evidence (platform
      evidence: what the agent reported, below tool traffic and backend state). See src/vatf/logs.py.
    type: object
    additionalProperties: false
    properties:
      source: {enum: [none, file, http], default: none}
      path: {description: "file: the log file (relative to the repo folder, or absolute).", type: string}
      match:
        description: "file: during_call keeps the lines written while the call ran; test_id keeps only lines containing the test id."
        enum: [during_call, test_id]
        default: during_call
      url: {description: "http: log search URL with {test_id}, {started_at}, {ended_at} placeholders.", type: string}
      headers: {type: object, additionalProperties: {type: string}}
      lines_field: {description: "http JSON answers: where the list of lines is (dots for nesting).", type: string}
      message_field: {description: "http JSON answers: the text of one line when lines are objects.", type: string, default: message}
      settle_ms: {description: "Wait this long after the call before reading, so the last lines are flushed.", type: integer, minimum: 0, default: 500}
      max_lines: {type: integer, minimum: 1, default: 300}
      heard_pattern:
        description: >
          Voice: a regular expression for the log lines in which the agent's speech recognition says
          what it heard the caller say, e.g. "User said: (?P<text>.+)". The named group "text" (or the
          first group) is the heard text; it is compared with the caller's words (metric caller_wer).
        type: string
      timing:
        description: >
          Voice, optional: where the agent's answer time goes, when its logs say so. One regular expression per
          stage, each with a named group "ms" for the milliseconds, e.g. llm: "llm_latency=(?P<ms>\\d+)".
          Vocto shows each stage's typical and slowest time in the Timing report. Logs that don't report it are skipped.
        type: object
        additionalProperties: false
        properties:
          stt: {description: "Speech recognition time.", type: string}
          llm: {description: "AI model time (to the first words of its reply).", type: string}
          tts: {description: "Voice time (to the first sound).", type: string}
    allOf:
      - if: {properties: {source: {const: file}}, required: [source]}
        then: {required: [path]}
      - if: {properties: {source: {const: http}}, required: [source]}
        then: {required: [url]}

  agent_process:
    description: >
      How vatf starts the agent on this computer, for agents that run locally (an open-source agent,
      or a client's agent on a test machine). Used by `vatf run --start-agent`, the dashboard's
      "Start the agent for me", and the exit check, which restarts it once for each planted bug.
      Without it, vatf calls an agent that is already running.
    type: object
    additionalProperties: false
    required: [command]
    properties:
      command:
        description: The program and its arguments, e.g. [uv, run, --project, my-agent, python, my-agent/bot.py].
        type: array
        minItems: 1
        items: {type: string}
      cwd: {description: "Folder to start it in, relative to the Vocto folder (default: the Vocto folder).", type: string}
      env:
        description: 'Extra environment variables. Secrets as ${NAME} (from the .env file).'
        type: object
        additionalProperties: {type: string}
      ready_url:
        description: >
          An http(s) or ws(s) address that answers once the agent is ready (default connection.target).
          vatf waits until it can connect.
        type: string
      ready_timeout_s: {type: integer, minimum: 1, default: 120}
      planted_bug_env:
        description: The environment variable that tells the agent which planted bug to switch on (empty for the clean agent).
        type: string

  planted_bugs:
    description: >
      Known bugs that can be planted into the agent (a changed prompt line, a handler that drops an
      error...), so the exit check can prove vatf catches each one: the clean agent must get GO and
      each planted bug's scenario must fail in every repeat. The agent is restarted with
      agent_process.planted_bug_env set to the bug's id.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, caught_by]
      properties:
        id: {type: string, pattern: "^[a-z0-9][a-z0-9_.-]*$"}
        title: {type: string}
        caught_by:
          type: object
          additionalProperties: false
          required: [scenario]
          properties:
            scenario: {description: The scenario that must fail in every repeat while this bug is planted., type: string}
            judge:
              description: >
                Optional: an AI judge item that must flag it (FAIL or NEEDS_REVIEW) in that scenario, for bugs
                no hard check can see (tone, made-up facts). Needs the AI judges on.
              type: string

  judges:
    description: >
      AI judges (L7, Phase 3): two models score every call against rubric items for the soft qualities hard
      checks cannot see (tone, made-up facts, staying in scope...); a third, stronger model settles items they
      split on. Their findings are opinions until an item is trusted on a person's labels (thresholds
      judge_min_labels, judge_min_fails, judge_min_tpr, judge_min_tnr).
    type: object
    additionalProperties: false
    properties:
      enabled: {type: boolean, default: true}
      primary_model: {description: "The first judge (default claude-sonnet-5-5).", type: string}
      secondary_model: {description: "The second, independent judge (default claude-haiku-5-5).", type: string}
      tiebreak: {description: "Ask a deciding judge when the first two split (two of three decide; safety items still go to a person).", type: boolean, default: true}
      tiebreak_model: {description: "The deciding judge (default claude-opus-5-5).", type: string}
      examples:
        description: >
          Worked examples from your labels, shown to the judges under their item (at most 3 per item, latest
          used). Adding one changes the item's wording, so its trust is measured again on new labels.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [item, said, answer]
          properties:
            item: {description: "Rubric item id.", type: string}
            said: {description: "What the agent said (or did) on that call.", type: string}
            answer: {enum: [PASS, FAIL]}
            why: {type: string}
            from: {description: "The label it came from (<test id>:<item id>); left out of the trust measure.", type: string}
      policy:
        description: >
          What the agent may and may not do, and what it knows (prices, opening hours, refund rules...).
          The judges use it to tell a made-up answer from a correct one.
        type: string
      items:
        description: >
          Rubric item ids judged on every call: built-in ones (vatf/rubrics.py) and judges.custom ids.
          Default: the universal items plus the pack for the profile's domain, plus every custom item.
        type: array
        items: {type: string}
      custom:
        description: This agent's own rubric items.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, question]
          properties:
            id: {type: string, pattern: "^[a-z0-9][a-z0-9._-]*$"}
            title: {type: string}
            question: {type: string}
            pass_when: {type: string}
            fail_when: {type: string}
            applies_when: {type: string}
            section: {enum: [accuracy, experience, security, safety], default: experience}
            severity: {enum: [blocker, major, minor], default: major}

  safety:
    description: >
      Built-in safety tests (src/vatf/attacks.py): attack calls written for this agent from its industry,
      tools and judge policy. They run when a run asks for them (dashboard: Include safety tests; CLI --safety).
    type: object
    additionalProperties: false
    properties:
      enabled: {type: boolean, default: true}
      packs:
        description: Which packs to run. Default all.
        type: array
        items: {enum: [off-topic, secrets, injection, made-up, others-data, harmful, abuse, policy, actions, messy, voice, own]}
      intensity:
        description: quick (about 12 calls), standard (about 30, 2 repeats), thorough (all, 3 repeats, adaptive attackers).
        enum: [quick, standard, thorough]
        default: standard
      off_topic:
        description: strict - decline anything off-topic; friendly - brief small talk is fine (no small-talk attacks).
        enum: [strict, friendly]
        default: strict
      canaries:
        description: >
          Planted fake secrets (put them in the agent's test setup or knowledge base). If one is ever said,
          logged or sent to a tool, the call fails. Use ${NAME} to keep a value in the .env file.
        type: array
        items: {type: string, minLength: 4}
      skip:
        description: Safety scenario ids to leave out (e.g. safety.messy.other-language).
        type: array
        items: {type: string}
      custom:
        description: >
          Your own safety questions, run at every intensity as safety.<pack>.custom-<title>. Put one in any
          pack, or in "own" for risks only this agent has.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [lines]
          properties:
            pack:
              enum: [off-topic, secrets, injection, made-up, others-data, harmful, abuse, policy, actions, messy, voice, own]
              default: own
            title: {description: "Short name shown in reports.", type: string}
            lines: {description: "What the caller says, one line per turn. A question with no lines is left out.", type: array, maxItems: 10, items: {type: string}}
            never_say: {description: "Words or phrases the agent must never say on this call (hard checks). Blank ones are ignored.", type: array, items: {type: string}}
            safe_answer: {description: "What a safe answer looks like; the AI judges check it.", type: string}
            blocks: {description: "A never_say hit or a failed safe answer blocks the release.", type: boolean, default: false}
            language: {description: "The language the caller speaks (e.g. ta for Tamil). Default the agent's.", type: string}
            from: {description: "Where the question came from (e.g. ai-writer), for your records.", type: string}
      review:
        description: >
          An unsafe or split answer from the AI judges on an attack call holds the release (Not enough evidence)
          until a person labels it; a confirmed unsafe answer is a NO-GO. Hard-check failures block at once either way.
        type: boolean
        default: true
      identity:
        description: >
          The identity check every attack call is held to: verify (the tool that checks the caller) must succeed
          before any guarded tool is called. Default: a tool whose name says it verifies the caller, guarding
          every other tool that changes data or takes personal details.
        type: object
        additionalProperties: false
        properties:
          enabled: {type: boolean, default: true}
          verify: {type: string}
          guarded: {type: array, items: {type: string}}
      poison:
        description: >
          The hidden-instruction test (Prompt tricks): which lookup tools' answers carry it (default every read tool)
          and the caller lines that make the agent look something up.
        type: object
        additionalProperties: false
        properties:
          tools: {type: array, items: {type: string}}
          lines: {type: array, maxItems: 6, items: {type: string}}

  resilience:
    description: >
      Resilience failure drills (src/vatf/drills.py). refusals: how this agent's own tools say no, used by the
      business refusal drills (already taken, payment declined, out of stock) instead of Vocto's plain wording.
      Often written by AI on the Resilience page to sound like the real API; you check them before saving.
    type: object
    additionalProperties: false
    properties:
      refusals:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [kind, body]
          properties:
            tool: {description: "The tool that answers this way (* or left out: every booking or order tool).", type: string}
            kind: {enum: [slot_taken, payment_declined, out_of_stock]}
            status: {description: "HTTP status (default 409, or 402 for payment_declined).", type: integer, minimum: 400, maximum: 599}
            body: {description: "The tool's answer, as the agent receives it (an object or text)."}
            from: {description: "Who wrote it: ai-writer when Claude drafted it.", type: string}

  thresholds:
    description: Release gate settings (L8). Every field has a framework default.
    type: object
    additionalProperties: false
    properties:
      repeats: {type: integer, minimum: 1, default: 3}
      pass_k_required:
        description: How many of the repeats must pass for a critical scenario. Default equals repeats (pass^k).
        type: integer
        minimum: 1
      latency_p50_ms: {type: integer, default: 800}
      latency_p95_ms: {type: integer, default: 1500}
      min_coverage:
        description: Share of planned calls that must end with a verified result (PASS or FAIL).
        type: number
        minimum: 0
        maximum: 1
        default: 0.9
      judge_min_kappa:
        description: Shown for information only (Cohen's kappa is unstable when nearly every call passes).
        type: number
        default: 0.6
      judge_min_labels:
        description: A judge rubric item needs at least this many calls labelled by a person before it can block.
        type: integer
        minimum: 1
        default: 20
      judge_min_fails:
        description: Of those, at least this many labelled Fail and as many labelled Pass, so both rates mean something.
        type: integer
        minimum: 1
        default: 5
      judge_min_tpr:
        description: Share of the calls you failed that the judges must fail too (catching real problems).
        type: number
        default: 0.9
      judge_min_tnr:
        description: Share of the calls you passed that the judges must pass too (not failing good calls).
        type: number
        default: 0.9
      max_harness_retries: {type: integer, minimum: 0, default: 2}

  metrics:
    description: >
      Phase 5 call quality metrics (src/vatf/metrics.py): this agent's good and warn values, and whether a
      run value in the bad band blocks the release. Unset fields keep the framework's defaults.
    type: object
    propertyNames: {enum: [ttfw_ms, response_p90_ms, response_p99_ms, longest_silence_ms, talked_over, barge_in_stop_ms, backchannel_kept, noise_kept, paused_cut_off, checkin_ms, talk_share, agent_wpm, heard_wer, caller_wer, repeated_question, turns_to_goal, escalated, duration_s]}
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        good: {type: number}
        warn: {type: number}
        blocks: {type: boolean, default: false}

  regression:
    description: >
      Phase 6 regression gate (src/vatf/compare.py): how a run is compared with the agent's baseline
      (baselines/<profile>.json) and which changes for the worse block the release. Unset fields keep the defaults.
    type: object
    additionalProperties: false
    properties:
      enabled: {description: "Compare runs with the baseline when there is one.", type: boolean, default: true}
      new_failures:
        description: A test that passed every repeat in the baseline fails at least once now.
        type: object
        additionalProperties: false
        properties: {blocks: {type: boolean, default: true}}
      latency:
        description: Response time p50 or p95 rose by more than increase_pct and increase_ms (the larger of the two).
        type: object
        additionalProperties: false
        properties:
          blocks: {type: boolean, default: false}
          increase_pct: {type: number, minimum: 0, default: 20}
          increase_ms: {type: number, minimum: 0, default: 150}
      scores:
        description: The Accuracy, Experience, Security or Safety score fell by drop_points or more.
        type: object
        additionalProperties: false
        properties:
          blocks: {type: boolean, default: false}
          drop_points: {type: number, minimum: 0, default: 10}
      metrics:
        description: A call quality metric moved to a worse band (good to warn, warn to bad).
        type: object
        additionalProperties: false
        properties: {blocks: {type: boolean, default: false}}
      judges:
        description: An AI judge item's pass rate fell by drop_points or more.
        type: object
        additionalProperties: false
        properties:
          blocks: {type: boolean, default: false}
          drop_points: {type: number, minimum: 0, default: 20}
      safety:
        description: A safety test fails a check it passed in the baseline.
        type: object
        additionalProperties: false
        properties: {blocks: {type: boolean, default: false}}
      load:
        description: "Load tests vs the load baseline, level by level: failed calls up by failed_points, pass rate down by pass_drop_points, slower p95 (the latency limits), lower capacity."
        type: object
        additionalProperties: false
        properties:
          blocks: {type: boolean, default: false}
          failed_points: {type: number, minimum: 0, default: 2}
          pass_drop_points: {type: number, minimum: 0, default: 20}
      cost:
        description: "The agent's cost per completed task and per call (needs costs prices): a change counts when it moved by more than increase_pct."
        type: object
        additionalProperties: false
        properties:
          blocks: {type: boolean, default: false}
          increase_pct: {type: number, minimum: 0, default: 10}
      confirm:
        description: "A test that passed every repeat in the baseline and fails once now is run reruns more times; it blocks only if at least min_failures of all its calls failed (else it shows as suspected)."
        type: object
        additionalProperties: false
        properties:
          reruns: {type: integer, minimum: 0, maximum: 20, default: 5}
          min_failures: {type: integer, minimum: 1, default: 2}
      baseline:
        description: "What a run is compared with: rolling 0 = the saved baseline run; 3 = the last 3 good runs made the same way, pooled."
        type: object
        additionalProperties: false
        properties:
          rolling: {type: integer, minimum: 0, maximum: 10, default: 0}

  alerts:
    description: >
      Phase 6 (src/vatf/alerts.py): where to send a message after a run. Runs with bug switches never alert.
      Keep the URL in the .env file and write ${NAME} here.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        name: {type: string}
        type: {enum: [slack, discord, webhook], default: webhook, description: "slack also suits Google Chat and Mattermost."}
        url: {type: string}
        enabled: {type: boolean, default: true}
        events:
          description: >
            Which runs alert. Default no_go, regression, recovered, and the real-call alerts (Phase 8):
            monitor (an alert rule over real calls broke) and monitor_recovered (they all cleared).
          type: array
          items: {enum: [no_go, regression, insufficient, recovered, monitor, monitor_recovered]}

  health_checks:
    description: >
      Phase 6 (src/vatf/health.py): a short run on a schedule. The dashboard starts one every every_minutes
      while it is open; `python -m vatf health <project>` runs one now (for cron or Task Scheduler).
    type: object
    additionalProperties: false
    properties:
      enabled: {type: boolean, default: false}
      every_minutes: {type: integer, minimum: 5, default: 60}
      scenarios: {description: "Test ids. Empty = the critical tests (all when none is critical).", type: array, items: {type: string}}
      repeats: {type: integer, minimum: 1, maximum: 10, default: 1}
      conditions: {enum: [as_written, phone, noisy, hard], default: as_written}
      judges: {description: "Run the AI judges too (costs money on every check).", type: boolean, default: false}
      start_agent: {description: "Scheduled checks start the agent first (agent_process). Leave off for an agent that is already running.", type: boolean, default: false}

  costs:
    description: >
      What the agent costs you to run (src/vatf/costs.py), for the cost per call and per completed task in
      reports and when comparing two versions. Vocto can't see the agent's bills: enter your own prices.
    type: object
    additionalProperties: false
    properties:
      currency: {description: "USD, INR, EUR, GBP or any other code.", type: string, default: USD}
      per_call: {description: "A fixed amount for every call.", type: number, minimum: 0}
      per_minute: {description: "Every minute of a call, all in (phone line, speech, AI).", type: number, minimum: 0}
      per_reply: {description: "Every answer the agent gives (an AI request per answer).", type: number, minimum: 0}
      per_tool_call: {description: "Every request the agent makes to your systems.", type: number, minimum: 0}

  load:
    description: >
      Phase 7 load test (src/vatf/load.py): many ordinary test calls at the same time, in a shape, with a
      GO / NO-GO for that load. `python -m vatf load <project>`, or the dashboard's Load test page.
      Every stage runs at or below calls_at_once, so every stage must meet the limits.
    type: object
    additionalProperties: false
    properties:
      shape:
        description: "ramp: 1 call up to calls_at_once in steps; spike: normal, everyone at once, normal again; soak: hold calls_at_once for a long time; steady: hold calls_at_once; find_limit: step up like ramp and stop at the first level that breaks a limit."
        enum: [ramp, spike, soak, steady, find_limit]
        default: ramp
      calls_at_once: {description: "The target: the most calls at the same time (the busiest time you expect).", type: integer, minimum: 1, maximum: 200, default: 5}
      start_at: {description: "Ramp: the first level. Spike: the normal traffic before and after the spike.", type: integer, minimum: 1, default: 1}
      steps: {description: "Ramp: levels from start_at up to calls_at_once.", type: integer, minimum: 1, maximum: 50, default: 4}
      step_minutes: {description: "Ramp: how long each level runs.", type: number, minimum: 0, default: 2}
      minutes: {description: "Steady and soak: how long to hold calls_at_once. Spike: how long the spike lasts.", type: number, minimum: 0, default: 10}
      before_minutes: {description: "Spike: normal traffic before the spike.", type: number, minimum: 0, default: 2}
      after_minutes: {description: "Spike: normal traffic after the spike (the recovery).", type: number, minimum: 0, default: 2}
      window_minutes: {description: "Soak: the hold is read in windows this long, to see drift.", type: number, minimum: 0, default: 5}
      pause_seconds: {description: "Each simulated caller waits this long before its next call.", type: number, minimum: 0, default: 0}
      max_calls: {description: "A load test never starts more calls than this.", type: integer, minimum: 1, default: 200}
      peak_calls_per_hour: {description: "Calls in your busiest hour. With call_minutes it sets calls_at_once (Little's law: calls per minute x minutes per call).", type: [number, "null"], exclusiveMinimum: 0}
      call_minutes: {description: "How long an average call lasts, in minutes (also used to warn when a stage is too short to judge).", type: [number, "null"], exclusiveMinimum: 0}
      expected_peak: {description: "Calls at once at your busiest time, for the headroom sentence (set from peak_calls_per_hour when that is given).", type: [integer, "null"], minimum: 1}
      light: {description: "Voice: light load callers (each caller line synthesised once and reused, no careful second listen), so one computer can push further.", type: boolean, default: true}
      unique_facts: {description: "Caller facts given a value of their own on every load call (e.g. full_name, phone), so a detail found in another call is a leak. Only facts the agent's backend doesn't need to find.", type: array, items: {type: string}}
      scenarios: {description: "Test ids, taken in turn. Empty = the tests in this mode without planted tool faults or safety attacks.", type: array, items: {type: string}}
      caller: {description: "free: scripted lines and the rule-based caller (no AI cost); claude: Claude plays the callers.", enum: [free, claude], default: free}
      judges: {description: "Run the AI judges on every load call (costs money).", type: boolean, default: false}
      conditions: {description: "Voice: caller conditions over every call.", enum: [as_written, phone, noisy, hard], default: as_written}
      start_agent: {description: "Start the agent first (agent_process) and stop it after.", type: boolean, default: false}
      limits:
        type: object
        additionalProperties: false
        properties:
          max_failed_pct: {description: "NO-GO when more calls than this fail in a stage (couldn't connect, agent error, stopped answering, ran too long).", type: number, minimum: 0, default: 2}
          p95_ms: {description: "NO-GO when the answer time p95 in a stage is over this. Empty: voice uses thresholds.latency_p95_ms, text has none.", type: [number, "null"], exclusiveMinimum: 0}
          slowdown:
            description: Answer time p95 at the top level vs the lowest level rose by more than pct and ms.
            type: object
            additionalProperties: false
            properties:
              blocks: {type: boolean, default: false}
              pct: {type: number, minimum: 0, default: 50}
              ms: {type: number, minimum: 0, default: 300}
          pass_drop:
            description: The pass rate at the top level fell by points or more from the lowest level.
            type: object
            additionalProperties: false
            properties:
              blocks: {type: boolean, default: false}
              points: {type: number, minimum: 0, default: 20}
          drift:
            description: "Soak: the last window's p95 rose by more than pct over the first's, or failed calls went up."
            type: object
            additionalProperties: false
            properties:
              blocks: {type: boolean, default: false}
              pct: {type: number, minimum: 0, default: 50}
          recovery:
            description: "Spike: after the spike, the answer time p95 must be back within pct (or ms, whichever is more) of before it, with no more failed calls."
            type: object
            additionalProperties: false
            properties:
              blocks: {type: boolean, default: false}
              pct: {type: number, minimum: 0, default: 25}
              ms: {type: number, minimum: 0, default: 200}
          max_lag_ms: {description: "Vocto's own computer: event-loop lag p95 above this makes a stage untrustworthy (not enough evidence, never NO-GO).", type: number, minimum: 1, default: 100}
          min_calls: {description: "A stage needs this many finished calls to decide anything; below it the stage shows as too few to judge.", type: integer, minimum: 1, default: 10}
          min_answers: {description: "A stage's answer-time p95 can break the limit only over at least this many timed answers.", type: integer, minimum: 1, default: 20}

  monitor:
    description: >
      Phase 8 (src/vatf/monitor/): monitoring real production calls. Calls come in by upload, a webhook or
      `python -m vatf monitor import`; personal data is removed before anything is saved; each call is scored
      with the call-quality metrics, real-call checks and (on a sample) the AI judges; alert rules go out
      through the alerts targets. Edited on the dashboard's Real calls page.
    type: object
    additionalProperties: false
    properties:
      enabled: {type: boolean, default: true}
      intake:
        type: object
        additionalProperties: false
        properties:
          token: {description: "The webhook's token, as ${NAME} (the value lives in the .env file).", type: [string, "null"]}
          listen: {description: "The dashboard receives this agent's webhook calls while it is open.", type: boolean, default: false}
          port: {description: "The dashboard's port for real-call webhooks (one for all agents).", type: integer, minimum: 1024, maximum: 65535, default: 8791}
      privacy:
        type: object
        additionalProperties: false
        properties:
          redact:
            description: Kinds of personal data removed from real calls before saving. Default all.
            type: array
            items: {enum: [email, bank, card, id_number, phone, birth_date, address, name]}
          patterns:
            description: Extra things to remove, each a name and a regular expression (pii.mask_patterns also apply).
            type: array
            items:
              type: object
              additionalProperties: false
              required: [name, regex]
              properties:
                name: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
                regex: {type: string}
          keep_recording_links: {description: "Keep the platform's recording link with each call.", type: boolean, default: false}
          retention_days: {description: "Real calls older than this are deleted. 0 keeps them.", type: integer, minimum: 0, maximum: 3650, default: 30}
      scoring:
        type: object
        additionalProperties: false
        properties:
          judges: {description: "Run the AI judges on real calls (costs money).", type: boolean, default: true}
          judge_share_pct: {description: "Share of calls the judges score (a fixed sample by call id).", type: number, minimum: 0, maximum: 100, default: 100}
          judge_max_per_day: {type: integer, minimum: 0, default: 50}
          judge_budget_usd_per_day: {type: number, minimum: 0, default: 5}
          always_judge_flagged: {description: "Calls a check or metric flagged are always judged (within the daily caps).", type: boolean, default: true}
      alerts:
        type: object
        additionalProperties: false
        properties:
          window_hours: {type: number, minimum: 1, maximum: 720, default: 24}
          min_calls: {description: "Rate rules wait for this many calls in the window.", type: integer, minimum: 1, default: 10}
          pass_rate_below: {type: [number, "null"], minimum: 0, maximum: 100, default: 85}
          flagged_above: {type: [number, "null"], minimum: 0, maximum: 100, default: 25}
          metrics_bad: {description: "Alert when a call-quality metric is in its bad band over the window.", type: boolean, default: true}
          safety: {description: "Alert on any failed safety judge item.", type: boolean, default: true}
          false_success: {description: "Alert on any possible false success.", type: boolean, default: true}

  limits:
    description: Cost and safety caps for one run.
    type: object
    additionalProperties: false
    properties:
      max_turns: {type: integer, default: 30}
      follow_up_turns:
        description: >
          Live runs. Caller turns Claude adds after a scripted call's fixed lines, listening to the agent
          (pushing on in a safety test, finishing the call in an order script). 0 ends calls with their fixed lines.
        type: integer
        minimum: 0
        default: 6
      max_call_seconds: {type: integer, default: 300}
      max_reply_tokens: {type: integer, default: 400}
      budget_usd: {type: number, default: 5}
      parallel_calls: {type: integer, default: 1}
      end_of_turn_ms:
        description: Voice. Silence after which the simulated caller takes the agent's turn as finished.
        type: integer
        default: 1000
      no_reply_ms:
        description: Voice. How long the caller waits for an answer before reacting (a persona's hangs_up_after_silence_ms wins).
        type: integer
        default: 15000

  pii:
    description: Patterns to mask in transcripts and stored evidence.
    type: object
    properties:
      mask_patterns:
        type: array
        items:
          type: object
          required: [name, regex]
          properties:
            name: {type: string}
            regex: {type: string}
