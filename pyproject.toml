[project]
name = "vatf"
version = "0.1.0"
description = "Voice Agent Testing Framework: test any voice agent, local-first."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6", "jsonschema>=4.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vatf"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
