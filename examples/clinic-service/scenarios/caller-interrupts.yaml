# Voice only: the caller talks over the agent (barge-in). The agent should stop talking within
# a second and deal with what the caller said, not carry on with its old sentence.
schema_version: "0.1"
kind: scenario
id: clinic-service.caller-interrupts
title: Caller interrupts the agent with their details
profile: clinic-service
tags: [booking, voice, barge-in]
criticality: normal
style: simulated
modes: [voice]

setup:
  now: "2026-11-02T09:00:00+00:00"
  fixtures: [zoo/clinic/fixtures/base.sql]

audio:
  barge_in:
    # The agent's 2nd turn is its answer to the caller's first request (turn 1 is the greeting).
    - agent_turn: 2
      offset_ms: 700
      say: Sorry, it's Maria Lopez, born the 14th of March 1985.
      stop_within_ms: 1000

caller:
  persona: calm-adult
  goal: Book a routine check-up with Dr Patel tomorrow, Tuesday 3 November, in the morning.
  facts:
    full_name: Maria Lopez
    date_of_birth: "1985-03-14"
    doctor: Dr Patel
    preferred_day: Tuesday 3 November
    preferred_time: morning
  rules:
    - If no morning slot is free, accept the earliest afternoon slot that day.
  end_when: The agent confirms the booking, or says it cannot book.
  max_turns: 16

outcome:
  expected: success
  action:
    tool: book_appointment
    args_match: {doctor: $doctor}
  record:
    probe: appointments_for_test
    expect_count: 1
    expect_fields: {full_name: $full_name, doctor: $doctor, status: booked}
  claim:
    method: patterns
    success_patterns: ["\\b(booked|confirmed|scheduled|all set)\\b"]
    failure_patterns: ["\\b(couldn't|could not|unable|not able|wasn't able|failed)\\b", "(?<!no )\\bproblem\\b", "\\btry again\\b"]
